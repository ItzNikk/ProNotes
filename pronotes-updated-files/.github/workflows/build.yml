name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      # Keep one signing key across builds so updates install over each other.
      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: pronotes-debug-keystore-v1

      - name: Signing from secrets (optional)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          fi

      # Every push to main is a release: version = newest CHANGELOG heading + build number (9.5.0.12),
      # so the in-app updater always sees it as newer. Tagged pushes (v9.5.0) keep the tag as the version.
      - name: Work out the version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            NAME="${GITHUB_REF_NAME#v}"
          else
            TOP=$(grep -m1 -oE '^## v[0-9]+(\.[0-9]+)*' CHANGELOG.md | sed 's/^## v//')
            NAME="${TOP:-1.0}.${GITHUB_RUN_NUMBER}"
          fi
          echo "VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$NAME" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          # Kept out of the source tree: the support screen reads it at build time.
          SUPPORT_UPI: ${{ secrets.SUPPORT_UPI }}
          SUPPORT_UPI_NAME: Pro Notes
        run: |
          gradle assembleRelease --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/ProNotes.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ProNotes-apk
          path: dist/ProNotes.apk

      - name: Release notes from CHANGELOG.md
        if: github.event_name != 'pull_request'
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            awk -v tag="## ${GITHUB_REF_NAME}" '$0==tag{f=1;next} /^## /{f=0} f' CHANGELOG.md > RELEASE_NOTES.md
          else
            awk '/^## /{n++; next} n==1' CHANGELOG.md > RELEASE_NOTES.md
          fi
          [ -s RELEASE_NOTES.md ] || echo "Improvements and fixes." > RELEASE_NOTES.md

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Pro Notes ${{ env.VERSION_NAME }}
          make_latest: true
          files: dist/ProNotes.apk
          body_path: RELEASE_NOTES.md
