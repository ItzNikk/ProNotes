[package]
name = "pro-notes"
version = "10.0.0"
description = "Pro Notes — Cross-Platform Study Notebook, Drawing & AI Studio"
authors = ["Pro Notes"]
edition = "2021"

[lib]
name = "pro_notes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
