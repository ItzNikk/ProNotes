name: Build and release Pro Notes (Android)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional tag to publish as a GitHub Release (e.g. v12.0.0). Leave empty for a build-only run.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  # ============================================================================
  # 1. Android APK Build
  # ============================================================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode signing keystore (if configured)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Signing keystore loaded from repository secrets."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Android signing secrets not configured — APK will be signed with the fallback key so it is installable."
          fi

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PRONOTES_UPI: ${{ vars.PRONOTES_UPI }}
          PRONOTES_UPI_NAME: ${{ vars.PRONOTES_UPI_NAME }}
          CLOUD_PROJECT_ID: ${{ secrets.CLOUD_PROJECT_ID }}
          CLOUD_DB_ID: ${{ secrets.CLOUD_DB_ID }}
          CLOUD_API_KEY: ${{ secrets.CLOUD_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: |
          EXTRA=""
          if [ -n "$PRONOTES_UPI" ]; then
            EXTRA="$EXTRA -Ppronotes.upi=$PRONOTES_UPI"
          fi
          if [ -n "$PRONOTES_UPI_NAME" ]; then
            EXTRA="$EXTRA -Ppronotes.upiName=$PRONOTES_UPI_NAME"
          fi
          gradle :app:assembleRelease --stacktrace $EXTRA

      - name: Collect APK
        id: apk
        run: |
          mkdir -p dist-android
          APK_Signed=$(find app/build/outputs/apk/release -name "*-release.apk" | head -n 1)
          APK_Unsigned=$(find app/build/outputs/apk/release -name "*-release-unsigned.apk" | head -n 1)
          VERSION_NAME=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION_NAME=${VERSION_NAME:-12.0.0}

          if [ -n "$APK_Signed" ]; then
            TARGET="dist-android/ProNotes-v${VERSION_NAME}.apk"
            cp "$APK_Signed" "$TARGET"
          elif [ -n "$APK_Unsigned" ]; then
            TARGET="dist-android/ProNotes-v${VERSION_NAME}-unsigned.apk"
            cp "$APK_Unsigned" "$TARGET"
          else
            echo "::error::No release APK found under app/build/outputs/apk/release"
            ls -la app/build/outputs/apk/release || true
            exit 1
          fi

          echo "apk_path=$TARGET" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          ls -lh dist-android/

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pronotes-android
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30

  # ============================================================================
  # 2. Combined GitHub Release (Android APK)
  # ============================================================================
  release:
    name: Publish GitHub Release
    needs: [build-android]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: pronotes-android
          path: artifacts/pronotes-android

      - name: Prepare release assets
        id: prep
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="${INPUT_TAG:-$REF_NAME}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          mkdir -p publish-assets
          cp artifacts/pronotes-android/*.apk publish-assets/ || true
          ls -lh publish-assets/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.tag }}
          name: Pro Notes ${{ steps.prep.outputs.tag }}
          generate_release_notes: true
          files: |
            publish-assets/*.apk
