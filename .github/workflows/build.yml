name: Build and release Pro Notes APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pronotes-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Android release APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      # Keep the debug fallback key stable between builds. A release key supplied
      # through repository secrets takes precedence in app/build.gradle.kts.
      - name: Restore signing key cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: pronotes-debug-keystore-v1

      - name: Restore optional release keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/pronotes-release.p12"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/pronotes-release.p12" >> "$GITHUB_ENV"
          fi

      - name: Calculate version
        shell: bash
        run: |
          set -euo pipefail
          BASE_VERSION="$(grep -m1 -oE '^## v[0-9]+(\.[0-9]+)*' CHANGELOG.md | sed 's/^## v//')"
          if [ -z "$BASE_VERSION" ]; then
            echo "No semantic version heading found in CHANGELOG.md" >&2
            exit 1
          fi
          VERSION_NAME="${BASE_VERSION}.${GITHUB_RUN_NUMBER}"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$VERSION_NAME" >> "$GITHUB_ENV"
          echo "Building Pro Notes $VERSION_NAME (versionCode $GITHUB_RUN_NUMBER)"

      - name: Build release variant
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SUPPORT_UPI: ${{ secrets.SUPPORT_UPI }}
          SUPPORT_UPI_NAME: Pro Notes
        run: |
          gradle assembleRelease --stacktrace
          mkdir -p dist
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "Release APK was not produced" >&2
            exit 1
          fi
          cp "$APK" dist/ProNotes.apk
          test -s dist/ProNotes.apk

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProNotes-${{ env.VERSION_NAME }}
          path: dist/ProNotes.apk
          if-no-files-found: error
          retention-days: 30

      - name: Prepare release notes
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          awk '/^## v/{if (found) exit; found=1; next} found {print}' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "Pro Notes improvements and fixes." > RELEASE_NOTES.md
          fi

      # Every successful push to main creates a uniquely versioned GitHub Release.
      # Tag pushes are deliberately not build triggers, avoiding a second run when
      # this action creates the release tag itself.
      - name: Publish GitHub Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Pro Notes ${{ env.VERSION_NAME }}
          make_latest: true
          files: dist/ProNotes.apk
          body_path: RELEASE_NOTES.md
