name: Build and release Pro Notes APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pronotes-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Android release APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK & Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" >> "$ANDROID_HOME/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd" >> "$ANDROID_HOME/licenses/android-sdk-preview-license"
          printf "\n89377a6dd597979a4b735e82f0250a435b0f4dd4" >> "$ANDROID_HOME/licenses/android-sdk-preview-license"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      # Ensure a valid signing key is always ready (production secret, decoded fallback, or generated).
      - name: Prepare signing keys
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > ~/.android/debug.keystore 2>/dev/null || base64 --decode debug.keystore.base64 > ~/.android/debug.keystore
          fi
          if [ ! -s ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          test -s ~/.android/debug.keystore

          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/pronotes-release.p12" 2>/dev/null || echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/pronotes-release.p12"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/pronotes-release.p12" >> "$GITHUB_ENV"
          fi

      - name: Calculate version
        shell: bash
        run: |
          set -euo pipefail
          BASE_VERSION="$(grep -m1 -oE '^## v[0-9]+(\.[0-9]+)*' CHANGELOG.md | sed 's/^## v//')"
          if [ -z "$BASE_VERSION" ]; then
            echo "No semantic version heading found in CHANGELOG.md" >&2
            exit 1
          fi
          VERSION_CODE="${GITHUB_RUN_NUMBER:-1}"
          VERSION_NAME="${BASE_VERSION}.${VERSION_CODE}"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$VERSION_NAME" >> "$GITHUB_ENV"
          echo "Building Pro Notes $VERSION_NAME (versionCode $VERSION_CODE)"

      - name: Build release variant
        env:
          VERSION_NAME: ${{ env.VERSION_NAME }}
          VERSION_CODE: ${{ env.VERSION_CODE }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SUPPORT_UPI: ${{ secrets.SUPPORT_UPI }}
          SUPPORT_UPI_NAME: Pro Notes
        run: |
          gradle assembleRelease --stacktrace
          mkdir -p dist
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "Release APK was not produced" >&2
            exit 1
          fi
          cp "$APK" dist/ProNotes.apk
          cp "$APK" "dist/ProNotes-v${{ env.VERSION_NAME }}.apk"
          test -s dist/ProNotes.apk
          test -s "dist/ProNotes-v${{ env.VERSION_NAME }}.apk"

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProNotes-${{ env.VERSION_NAME }}
          path: |
            dist/ProNotes.apk
            dist/ProNotes-v${{ env.VERSION_NAME }}.apk
          if-no-files-found: error
          retention-days: 30

      - name: Prepare release notes
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          awk '/^## v/{if (found) exit; found=1; next} found {print}' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "Pro Notes improvements and fixes." > RELEASE_NOTES.md
          fi

      - name: Clean up existing release tag if re-running
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "${{ env.RELEASE_TAG }}" --cleanup-tag --yes || true

      # Every successful push to main creates a uniquely versioned GitHub Release.
      # Tag pushes are deliberately not build triggers, avoiding a second run when
      # this action creates the release tag itself.
      - name: Publish GitHub Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Pro Notes ${{ env.VERSION_NAME }}
          make_latest: true
          files: |
            dist/ProNotes.apk
            dist/ProNotes-v${{ env.VERSION_NAME }}.apk
          body_path: RELEASE_NOTES.md
